name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/incident_response' }}

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE:-}" ]; then
            pnpm commitlint --from "$BASE" --to "$HEAD" --verbose
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            pnpm commitlint --from "$BEFORE" --to "${{ github.sha }}" --verbose
          else
            pnpm commitlint --last --verbose
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: oxfmt check
        run: pnpm format:check

      - name: oxlint check
        run: pnpm lint:check

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: i18n catalogs up to date
        run: pnpm i18n:verify

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incident_response
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incident_response"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Apply migrations
        run: pnpm prisma:migrate

      - name: Create search indexes
        run: pnpm prisma:search-indexes

      - name: Verify the database matches the contract
        run: pnpm prisma:db-verify

      - name: Seed
        run: pnpm prisma:seed

      - name: Run end-to-end tests
        run: pnpm test:e2e

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: incident-response:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image size
        run: docker image ls incident-response:ci

      - name: Boot the image
        run: docker run --detach --name api --network host --env PORT=3000 --env DATABASE_URL=postgresql://unused incident-response:ci

      - name: The bundled image answers a query
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl -sf --max-time 2 -H 'content-type: application/json' -d '{"query":"{ __typename }"}' http://localhost:3000/graphql | grep -q '"__typename":"Query"'; then
              echo "the bundled image serves GraphQL"
              exit 0
            fi
            sleep 1
          done

          echo "the image never answered"
          docker logs api
          exit 1
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build app
        run: pnpm build

      - name: Bundle to one file
        run: pnpm bundle
