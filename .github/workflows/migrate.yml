name: Migrate a deployed database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose DATABASE_URL secret to use
        required: true
        default: production
        type: string

jobs:
  migrate:
    name: Migrate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Show what is pending
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma:migrate-status

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma:migrate

      - name: Create search indexes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma:search-indexes

      - name: Verify the database matches the contract
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma:db-verify
