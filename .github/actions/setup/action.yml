name: Setup
description: pnpm, Node and dependencies, restored from cache when the lockfile is unchanged

runs:
  using: composite

  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: "pnpm"

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: modules-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
