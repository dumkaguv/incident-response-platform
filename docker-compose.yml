services:
  postgres:
    image: postgres:17-alpine
    container_name: incident-response-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_response

    ports:
      - '55432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d incident_response']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
